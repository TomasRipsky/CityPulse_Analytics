name: citypulse
version: "2.0.0"
profile: citypulse

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]

clean-targets: ["target", "dbt_packages"]

vars:
  timezone: "America/New_York"

seeds:
  citypulse:
    +schema: intermediate

data_tests:
  citypulse:
    +store_failures: true # failing rows land in the `audit` dataset for inspection
    +schema: audit

models:
  citypulse:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

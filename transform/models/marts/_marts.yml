version: 2

models:
  - name: fct_city_day
    description: >
      One row per New York day: trips (null when the month was not loaded, 0 when nobody rode),
      weather, air quality and calendar. Grain: local_date.
    columns:
      - name: local_date
        data_tests: [unique, not_null]
      - name: trips
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 400000}

  - name: fct_city_hour
    description: >
      One row per hour with weather (hour_start, UTC): trips that started in it, weather for that
      hour (interval variables already moved to the hour they describe), AQI. Grain: hour_start.
    columns:
      - name: hour_start
        data_tests: [unique, not_null]

  - name: mart_city_month
    description: "Monthly summary for dashboards. Grain: month."
    columns:
      - name: month
        data_tests: [unique, not_null]

  - name: mart_baselines
    description: >
      Expected trips: the mean of the reference periods for each condition — dry hours (rain),
      dry days (snow), dry days with gusts under 40 km/h (wind), dry days with good air (air
      quality) — for the same month, kind of day (holidays count as weekends) and, hourly, the same
      hour; per rider; at least 3 reference periods. Grain: reference × month × day_type ×
      local_hour (null for daily) × rider.
    data_tests:
      - unique_combination:
          arguments:
            columns: ["reference", "month", "day_type", "local_hour", "rider"]

  - name: mart_condition_effects
    description: >
      Trips above or below what dry conditions would give, by condition (rain per hour; snow,
      wind and air quality per day), band and rider. Grain: condition × band × rider.
    data_tests:
      - unique_combination:
          arguments:
            columns: ["condition", "band", "rider"]

  - name: mart_temperature_curve
    description: "Trips per dry day by felt temperature (5 °C bands) and kind of day. Grain: band × day_type."

  - name: mart_temperature_response
    description: "% change in trips per °C warmer than usual for the month, per rider. Grain: rider."
    columns:
      - name: rider
        data_tests: [unique, not_null]

unit_tests:
  - name: effect_is_actual_over_expected_minus_one
    model: mart_condition_effects
    given:
      - input: ref('fct_city_hour')
        rows:
          - {trips_loaded: true, service_closed: false, precipitation_mm: 2.0, snowfall_cm: 0, month: "2025-07-01", day_type: "workday", local_hour: 8, trips: 700, member_trips: 600, casual_trips: 100}
      - input: ref('fct_city_day')
        rows: []
      - input: ref('mart_baselines')
        rows:
          - {reference: "dry hour", month: "2025-07-01", day_type: "workday", local_hour: 8, rider: "all", expected_trips: 1000}
          - {reference: "dry hour", month: "2025-07-01", day_type: "workday", local_hour: 8, rider: "member", expected_trips: 750}
          - {reference: "dry hour", month: "2025-07-01", day_type: "workday", local_hour: 8, rider: "casual", expected_trips: 250}
    expect:
      rows:
        - {condition: "rain", band: "rain (1–4 mm/h)", rider: "all", trips: 700, expected_trips: 1000, effect_pct: -30.0}
        - {condition: "rain", band: "rain (1–4 mm/h)", rider: "member", trips: 600, expected_trips: 750, effect_pct: -20.0}
        - {condition: "rain", band: "rain (1–4 mm/h)", rider: "casual", trips: 100, expected_trips: 250, effect_pct: -60.0}

  - name: daily_effects_compare_with_their_reference_band_and_holidays_count_as_weekends
    model: mart_condition_effects
    given:
      - input: ref('fct_city_hour')
        rows: []
      - input: ref('fct_city_day')
        rows:
          # a windy dry holiday: compared with calm dry weekend days of the same month
          - {trips_loaded: true, service_closed: false, is_dry: true, snowfall_cm: 0, wind_gusts_max_kmh: 60, aqi_category: null, month: "2025-07-01", day_type: "holiday", trips: 80, member_trips: 50, casual_trips: 30}
      - input: ref('mart_baselines')
        rows:
          - {reference: "calm dry day", month: "2025-07-01", day_type: "weekend", local_hour: null, rider: "all", expected_trips: 100}
          - {reference: "calm dry day", month: "2025-07-01", day_type: "weekend", local_hour: null, rider: "member", expected_trips: 50}
          - {reference: "calm dry day", month: "2025-07-01", day_type: "weekend", local_hour: null, rider: "casual", expected_trips: 50}
          # the dry-day baseline must not be used for wind
          - {reference: "dry day", month: "2025-07-01", day_type: "weekend", local_hour: null, rider: "all", expected_trips: 80}
    expect:
      rows:
        - {condition: "snow", band: "dry (reference)", rider: "all", trips: 80, expected_trips: 80, effect_pct: 0.0}
        - {condition: "wind", band: "windy (55–70 km/h)", rider: "all", trips: 80, expected_trips: 100, effect_pct: -20.0}
        - {condition: "wind", band: "windy (55–70 km/h)", rider: "member", trips: 50, expected_trips: 50, effect_pct: 0.0}
        - {condition: "wind", band: "windy (55–70 km/h)", rider: "casual", trips: 30, expected_trips: 50, effect_pct: -40.0}

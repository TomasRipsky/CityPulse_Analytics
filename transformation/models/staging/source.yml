version: 2

sources:
  - name: citypulse_staging
    database: project-6c4733db-2f24-496d-90f
    schema: citypulse_staging
    description: "Tablas raw cargadas desde GCS Silver por los loaders de Python"
    tables:
      - name: weather
        description: "Datos horarios de clima para NYC — Open-Meteo Forecast"
        columns:
          - name: timestamp
            description: "Timestamp de la hora"
          - name: date
            description: "Fecha del registro — columna de partición"
          - name: temperature_c
            description: "Temperatura en grados Celsius"
          - name: precipitation_mm
            description: "Precipitación en milímetros"
          - name: wind_speed_kmh
            description: "Velocidad del viento en km/h"
          - name: humidity_pct
            description: "Humedad relativa en porcentaje"
          - name: location
            description: "Ubicación — siempre NYC"

      - name: air_quality
        description: "Datos horarios de calidad del aire para NYC — Open-Meteo Air Quality"
        columns:
          - name: timestamp
            description: "Timestamp de la hora"
          - name: date
            description: "Fecha del registro — columna de partición"
          - name: pm2_5
            description: "Partículas finas PM2.5 en µg/m³"
          - name: pm10
            description: "Partículas PM10 en µg/m³"
          - name: ozone
            description: "Ozono en µg/m³"
          - name: us_aqi
            description: "Índice de calidad del aire según la EPA de EEUU"
          - name: aqi_category
            description: "Categoría del AQI: Good, Moderate, Unhealthy..."
          - name: location
            description: "Ubicación — siempre NYC"

      - name: citibike
        description: "Viajes en bicicleta de NYC — Citibike Trip Data"
        columns:
          - name: ride_id
            description: "Identificador único del viaje"
          - name: rideable_type
            description: "Tipo de bicicleta: classic_bike, electric_bike"
          - name: started_at
            description: "Timestamp de inicio del viaje"
          - name: ended_at
            description: "Timestamp de fin del viaje"
          - name: start_station_name
            description: "Nombre de la estación de origen"
          - name: end_station_name
            description: "Nombre de la estación de destino"
          - name: member_casual
            description: "Tipo de usuario: member o casual"
          - name: duration_minutes
            description: "Duración del viaje en minutos"
          - name: year
            description: "Año del viaje — columna de partición"
          - name: month
            description: "Mes del viaje — columna de partición"

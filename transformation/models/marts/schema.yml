version: 2

models:
  - name: daily_weather_summary
    description: >
      Resumen diario de clima para NYC. Agrega los datos horarios de Open-Meteo
      en una fila por día con temperatura, precipitación, viento y humedad.
      Fuente de verdad para el análisis climático del dashboard.
    columns:
      - name: date
        description: "Fecha del resumen (granularidad diaria)"
        tests:
          - not_null
          - unique
      - name: location
        description: "Ubicación — siempre NYC"
      - name: temp_avg_c
        description: "Temperatura media del día en grados Celsius"
        tests:
          - not_null
          - between:
              min_value: -30
              max_value: 50
      - name: temp_min_c
        description: "Temperatura mínima registrada durante el día"
      - name: temp_max_c
        description: "Temperatura máxima registrada durante el día"
      - name: precipitation_total_mm
        description: "Precipitación acumulada total del día en milímetros"
        tests:
          - not_null
      - name: wind_avg_kmh
        description: "Velocidad media del viento durante el día en km/h"
      - name: wind_max_kmh
        description: "Velocidad máxima del viento registrada durante el día en km/h"
      - name: humidity_avg_pct
        description: "Humedad relativa media del día en porcentaje"
        tests:
          - between:
              min_value: 0
              max_value: 100

  - name: daily_air_quality_summary
    description: >
      Resumen diario de calidad del aire para NYC. Agrega los datos horarios
      de Open-Meteo Air Quality en una fila por día con AQI, contaminantes
      y distribución de horas por categoría de calidad.
    columns:
      - name: date
        description: "Fecha del resumen (granularidad diaria)"
        tests:
          - not_null
          - unique
      - name: location
        description: "Ubicación — siempre NYC"
      - name: pm2_5_avg
        description: "Concentración media de partículas finas PM2.5 en µg/m³"
      - name: pm2_5_max
        description: "Concentración máxima de PM2.5 registrada durante el día"
      - name: pm10_avg
        description: "Concentración media de partículas PM10 en µg/m³"
      - name: ozone_avg
        description: "Concentración media de ozono troposférico en µg/m³"
      - name: aqi_avg
        description: "Índice de calidad del aire medio del día (escala EPA de EEUU)"
        tests:
          - not_null
          - between:
              min_value: 0
              max_value: 500
      - name: aqi_max
        description: "Índice de calidad del aire máximo registrado durante el día"
      - name: aqi_dominant_category
        description: "Categoría AQI que más horas ocupó durante el día"
        tests:
          - not_null
          - accepted_values:
              values:
                - "Good"
                - "Moderate"
                - "Unhealthy for Sensitive Groups"
                - "Unhealthy"
                - "Very Unhealthy"
                - "Hazardous"
                - "Unknown"
      - name: hours_good
        description: "Número de horas del día con AQI en categoría Good (0-50)"
      - name: hours_moderate
        description: "Número de horas del día con AQI en categoría Moderate (51-100)"
      - name: hours_unhealthy_sensitive
        description: "Horas con AQI en categoría Unhealthy for Sensitive Groups (101-150)"
      - name: hours_unhealthy
        description: "Número de horas del día con AQI en categoría Unhealthy (151-200)"
      - name: hours_very_unhealthy
        description: "Número de horas del día con AQI en categoría Very Unhealthy (201-300)"
      - name: hours_hazardous
        description: "Número de horas del día con AQI en categoría Hazardous (>300)"

  - name: daily_mobility_summary
    description: >
      Resumen diario de movilidad de Citibike NYC. Agrega los viajes individuales
      en una fila por día con volumen, duración, tipo de usuario y tipo de bicicleta.
      Nota: Citibike publica datos con ~6 semanas de retraso.
    columns:
      - name: date
        description: "Fecha del resumen derivada del timestamp de inicio del viaje"
        tests:
          - not_null
          - unique
      - name: year
        description: "Año — columna de partición heredada de la fuente"
      - name: month
        description: "Mes — columna de partición heredada de la fuente"
      - name: total_rides
        description: "Total de viajes iniciados durante el día"
        tests:
          - not_null
      - name: active_start_stations
        description: "Número de estaciones de origen distintas con actividad ese día"
      - name: active_end_stations
        description: "Número de estaciones de destino distintas con actividad ese día"
      - name: duration_avg_min
        description: "Duración media de los viajes en minutos"
        tests:
          - between:
              min_value: 0
              max_value: 1440
      - name: duration_min_min
        description: "Duración mínima registrada en minutos"
      - name: duration_max_min
        description: "Duración máxima registrada en minutos"
      - name: rides_member
        description: "Número de viajes realizados por usuarios con suscripción member"
      - name: rides_casual
        description: "Número de viajes realizados por usuarios casual (sin suscripción)"
      - name: pct_member
        description: "Porcentaje de viajes realizados por usuarios member sobre el total"
      - name: rides_electric
        description: "Número de viajes en bicicleta eléctrica"
      - name: rides_classic
        description: "Número de viajes en bicicleta clásica"
      - name: pct_electric
        description: "Porcentaje de viajes en bicicleta eléctrica sobre el total"

  - name: monthly_city_pulse
    description: >
      Mart de correlación mensual — el modelo central de CityPulse Analytics.
      Une clima, calidad del aire y movilidad a nivel mensual para analizar
      cómo el entorno urbano afecta el comportamiento ciudadano en NYC.
      Responde preguntas como: ¿el frío reduce los viajes en bici? ¿la lluvia
      desplaza usuarios casual hacia member? ¿el AQI alto afecta la movilidad?
      Incluye métricas derivadas de correlación calculadas en DBT.
    columns:
      - name: month_date
        description: "Primer día del mes — eje temporal principal para Looker Studio"
        tests:
          - not_null
          - unique
      - name: year
        description: "Año del mes"
      - name: month
        description: "Número de mes (1-12)"
      - name: total_rides
        description: "Total de viajes Citibike en el mes"
        tests:
          - not_null
      - name: rides_per_day
        description: "Media de viajes por día — normaliza meses con distinto número de días"
        tests:
          - not_null
      - name: duration_avg_min
        description: "Duración media de los viajes en minutos durante el mes"
      - name: pct_member
        description: "Porcentaje de viajes de usuarios member sobre el total mensual"
      - name: pct_electric
        description: "Porcentaje de viajes en bicicleta eléctrica sobre el total mensual"
      - name: temp_avg_c
        description: "Temperatura media mensual en grados Celsius"
      - name: temp_stddev_c
        description: "Desviación estándar de la temperatura — mide la variabilidad térmica del mes"
      - name: precipitation_total_mm
        description: "Precipitación total acumulada durante el mes en milímetros"
      - name: rainy_days
        description: "Número de días con alguna precipitación durante el mes"
      - name: heavy_rain_days
        description: "Número de días con precipitación intensa (>10mm) durante el mes"
      - name: windy_days
        description: "Número de días con viento fuerte (>30 km/h) durante el mes"
      - name: weather_category
        description: "Clasificación climática del mes basada en temperatura media"
        tests:
          - not_null
          - accepted_values:
              values: ["Freezing", "Cold", "Mild", "Warm", "Hot"]
      - name: aqi_avg
        description: "AQI medio mensual"
      - name: pct_hours_good_air
        description: "Porcentaje de horas del mes con aire en categoría Good"
      - name: days_acceptable_aqi
        description: "Número de días del mes con AQI medio aceptable (≤100)"
      - name: air_quality_category
        description: "Clasificación de calidad del aire del mes basada en AQI medio"
        tests:
          - not_null
          - accepted_values:
              values: ["Good", "Moderate", "Unhealthy for Sensitive Groups", "Unhealthy"]
      - name: rides_per_mm_rain
        description: "Ratio viajes por mm de precipitación — mide sensibilidad de uso a la lluvia"
      - name: casual_rides_per_degree
        description: "Ratio viajes casual por grado de temperatura — mide sensibilidad al calor"
      - name: conditions_category
        description: "Clasificación general de condiciones del mes: Favorable, Neutral o Adverse"
        tests:
          - not_null
          - accepted_values:
              values: ["Favorable", "Neutral", "Adverse"]

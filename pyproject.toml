[project]
name = "citypulse"
version = "2.0.0.dev0"
description = "Does the weather change how New York rides bikes? Batch ELT over Open-Meteo weather and air quality and every Citi Bike trip (GCS → BigQuery → dbt → Airflow)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pyarrow>=25.0.1",
]

[project.scripts]
citypulse = "citypulse.cli:main"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.16"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

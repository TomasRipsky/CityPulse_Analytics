# CityPulse on Airflow 3.3, locally. Adapted from the official docker-compose.yaml of Airflow
# 3.3.2: LocalExecutor instead of Celery (no redis, worker or flower — one machine runs the tasks),
# the CityPulse image instead of the stock one, DAGs baked into the image (no mounted folder), and
# a login-free UI bound to 127.0.0.1 only. Started by `make airflow-up ENV=…`.
x-airflow-common:
  &airflow-common
  image: citypulse-airflow:${CITYPULSE_ENV:-dev}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: 16
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-only-not-a-secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'true'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # The pipeline's settings and credentials (Application Default Credentials of the host:
    # ideally `gcloud auth application-default login --impersonate-service-account=…`).
    CITYPULSE_ENV: ${CITYPULSE_ENV:-dev}
    CITYPULSE_BQ_PROJECT: ${CITYPULSE_BQ_PROJECT:?set by make}
    CITYPULSE_LAKE_URI: ${CITYPULSE_LAKE_URI:?set by make}
    # The frozen dataset's last New York day: no DAG schedules beyond it. Empty = keep running.
    CITYPULSE_LAST_DAY: ${CITYPULSE_LAST_DAY:-}
    GOOGLE_CLOUD_PROJECT: ${CITYPULSE_BQ_PROJECT}
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/gcp/adc.json
  volumes:
    - ${HOME}/.config/gcloud/application_default_credentials.json:/opt/airflow/gcp/adc.json:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
  airflow-logs:
